name: publish

# Publishes the onnxruntime-ep-mlx wheel to PyPI AND the onnxruntime-ep-mlx crate to
# crates.io, both via Trusted Publishing (OIDC) — no long-lived API tokens.
#
# ⚠️ VERIFY against your Trusted Publisher configs before a release:
#   PyPI (project onnxruntime-ep-mlx)   -> workflow publish.yml, environment `pypi`
#   crates.io (crate onnxruntime-ep-mlx)-> workflow publish.yml, environment `crates`
#   (crate name = [package].name in rust/Cargo.toml; PyPI name = [project].name in
#    python/pyproject.toml). Both publish jobs declare `id-token: write`.
#

on:
  release:
    types: [published]
  workflow_dispatch:

# Repo-wide rule: ONNX Runtime telemetry stays off in CI. Workflow-level so every job
# inherits it, including steps that invoke ORT outside pytest and so never load the
# rootdir conftest that sets it locally.
env:
  ORT_DISABLE_TELEMETRY: "1"

jobs:
  build-wheels:
    name: Build distributions (macOS arm64)
    runs-on: macos-14
    env:
      ORT_VERSION: "1.29.0"
      MLX_VERSION: "0.32.1"
      MLXC_VERSION: "0.6.0_4"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install mlx-c (hard dependency)
        run: |
          brew update
          brew install mlx-c
          test "$(brew list --versions mlx | awk '{print $2}')" = "$MLX_VERSION"
          test "$(brew list --versions mlx-c | awk '{print $2}')" = "$MLXC_VERSION"

      - name: Install Rust toolchain (rustup — no third-party action, supply-chain hardening)
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          rustc --version && cargo --version

      - name: Provision ONNX Runtime ${{ env.ORT_VERSION }}
        run: |
          set -euo pipefail
          curl -fsSL \
            "https://github.com/microsoft/onnxruntime/releases/download/v${ORT_VERSION}/onnxruntime-osx-arm64-${ORT_VERSION}.tgz" \
            | tar xz
          echo "ORT_HOME=$PWD/onnxruntime-osx-arm64-${ORT_VERSION}" >> "$GITHUB_ENV"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Build sdist and wheel (hatchling; cargo dylib + mlx bundled)
        run: |
          python -m pip install --upgrade pip build
          python -m build --sdist ./python -o wheelhouse
          python - <<'PY'
          import glob
          import tarfile

          sdist, = glob.glob("wheelhouse/*.tar.gz")
          with tarfile.open(sdist) as archive:
              readmes = [m for m in archive.getmembers() if m.name.count("/") == 1 and m.name.endswith("/README.md")]
              assert len(readmes) == 1 and readmes[0].isfile(), readmes
          PY
          # hatch_build.py runs `cargo build --release`, bundles the cargo-built
          # libonnxruntime_mlx_ep.dylib + the mlx runtime (install_name_tool relink),
          # and forces a single py3-none-macosx_*_arm64 platform wheel. No CPython
          # ABI is embedded, so one wheel serves 3.12/3.13 and the free-threaded
          # builds alike.
          ORT_INCLUDE_DIR="$ORT_HOME/include" MACOSX_DEPLOYMENT_TARGET=14.0 \
            python -m build --wheel ./python -o wheelhouse
          wheel="$(find wheelhouse -maxdepth 1 -name '*-py3-none-macosx_*_arm64.whl' -print -quit)"
          test -n "$wheel"
          rm -rf /tmp/mlx-wheel-audit
          mkdir -p /tmp/mlx-wheel-audit
          unzip -q "$wheel" -d /tmp/mlx-wheel-audit
          while IFS= read -r dylib; do
            test "$(lipo -archs "$dylib")" = "arm64"
          done < <(find /tmp/mlx-wheel-audit -name '*.dylib' -type f)
          ls -la wheelhouse

      - name: Audit wheels (abi3audit — no native Python ABI to violate)
        run: |
          python -m pip install --upgrade abi3audit
          # No compiled Python extension ships in the wheel, so abi3audit finds
          # nothing auditable and --strict passes (abi3-clean by construction).
          python -m abi3audit --strict --report wheelhouse/*.whl

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: distributions
          path: |
            wheelhouse/*.whl
            wheelhouse/*.tar.gz

  publish:
    name: Publish to PyPI (Trusted Publishing)
    needs: build-wheels
    runs-on: ubuntu-latest
    # OIDC trusted publishing — no PyPI token. Environment name must match the trusted-publisher config.
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: distributions
          path: dist

      - name: Publish
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          # Idempotent: lets you safely re-run the whole workflow (e.g. to retry
          # the crates.io job once onnx-runtime-tracer is published) without the
          # already-uploaded PyPI wheel causing a failure.
          skip-existing: true

  publish-crate:
    name: Publish to crates.io
    needs: build-wheels
    runs-on: macos-14
    # The crate is a cdylib that only builds on Apple Silicon (mlx-c + Metal), so
    # `cargo publish`'s verify build must run on macos-14. Auth is via crates.io
    # Trusted Publishing (OIDC) — no long-lived token; the `crates` environment is
    # the configured trusted publisher (repo justinchuby/onnxruntime-mlx, this workflow).
    environment: crates
    permissions:
      id-token: write # required for the OIDC token exchange with crates.io
    env:
      ORT_VERSION: "1.29.0"
      MLX_VERSION: "0.32.1"
      MLXC_VERSION: "0.6.0_4"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install mlx-c (hard dependency)
        run: |
          brew update
          brew install mlx-c
          test "$(brew list --versions mlx | awk '{print $2}')" = "$MLX_VERSION"
          test "$(brew list --versions mlx-c | awk '{print $2}')" = "$MLXC_VERSION"

      - name: Install Rust toolchain (rustup — no third-party action, supply-chain hardening)
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          rustc --version && cargo --version

      - name: Provision ONNX Runtime ${{ env.ORT_VERSION }}
        run: |
          set -euo pipefail
          curl -fsSL \
            "https://github.com/microsoft/onnxruntime/releases/download/v${ORT_VERSION}/onnxruntime-osx-arm64-${ORT_VERSION}.tgz" \
            | tar xz
          echo "ORT_HOME=$PWD/onnxruntime-osx-arm64-${ORT_VERSION}" >> "$GITHUB_ENV"

      - name: Exchange OIDC for a crates.io token (Trusted Publishing)
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        id: auth

      - name: cargo publish
        # `onnx-runtime-tracer` must already be on crates.io (the path is stripped
        # at publish time and resolved from the registry). A short-lived token is
        # minted per-run by the Trusted Publishing OIDC exchange above.
        run: |
          cd rust
          version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)"
          if curl -fsS -A "onnxruntime-mlx-release-check" \
            "https://crates.io/api/v1/crates/onnxruntime-ep-mlx/$version" >/dev/null; then
            echo "onnxruntime-ep-mlx $version already exists on crates.io; skipping"
          else
            ORT_INCLUDE_DIR="$ORT_HOME/include" cargo publish
          fi
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
